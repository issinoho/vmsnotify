# nginx: TLS in front of the test servers (compose.yaml, service tls).
# Each server has its own https port; the certificate is tls-cert's.

ssl_certificate     /certs/server.crt;
ssl_certificate_key /certs/server.key;
ssl_protocols       TLSv1.2 TLSv1.3;

server {
    listen 18443 ssl;
    location / { proxy_pass http://gotify:80; proxy_set_header Host $host; }
}

server {
    listen 18444 ssl;
    location / { proxy_pass http://apprise:8000; proxy_set_header Host $host; }
}

server {
    listen 18445 ssl;
    location / { proxy_pass http://ntfy:80; proxy_set_header Host $host; }
}
