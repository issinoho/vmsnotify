# Test notification servers for vmsnotify (tools/test-endpoints).
#
# Throwaway servers for testing vmsnotify's Gotify, Apprise and ntfy
# endpoints from OpenVMS. They are for a test LAN only: open or default
# credentials, no TLS. Do not use them for production.
#
# Host ports 4318 and 4319 (an OpenTelemetry collector), 3000, 3100 and
# 9090 are already in use on docker-nuc (192.168.0.218), so these
# services use 18080, 18000 and 18081 to avoid them.
#
# Start:             docker compose up -d
# Stop and delete all data: docker compose down -v

services:
  gotify:
    image: gotify/server:3.1.1
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - gotify-data:/app/data
    environment:
      # The admin password, from GOTIFY_ADMIN_PASSWORD in a .env file next
      # to this one (git-ignored: `echo GOTIFY_ADMIN_PASSWORD=... > .env`).
      # It is used only when the data volume is first created; changing it
      # later has no effect on an existing volume.
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASSWORD:-changeme}

  apprise:
    image: caronc/apprise:2.1.0
    restart: unless-stopped
    ports:
      - "18000:8000"
    volumes:
      - apprise-config:/config
    environment:
      # "simple" keeps configurations in /config, keyed by name (here: vms).
      APPRISE_STATEFUL_MODE: simple

  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    restart: unless-stopped
    command: serve
    ports:
      - "18081:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: http://192.168.0.218:18081

  # TLS in front of the three, for vmsnotify's TLS tests: https on 18443
  # (Gotify), 18444 (Apprise API) and 18445 (ntfy). The certificate is
  # self-signed for IP 192.168.0.218, made once by `tls-cert` into the
  # tls-cert volume; being its own root, it is also the cafile vmsnotify
  # verifies against (fetch it with openssl s_client, as the README says).
  tls-cert:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -s /certs/server.crt ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825
        -subj /CN=vmsnotify-test-endpoints
        -addext subjectAltName=IP:192.168.0.218
        -keyout /certs/server.key -out /certs/server.crt
    volumes:
      - tls-cert:/certs

  tls:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      tls-cert:
        condition: service_completed_successfully
      gotify:
        condition: service_started
      apprise:
        condition: service_started
      ntfy:
        condition: service_started
    ports:
      - "18443:18443"
      - "18444:18444"
      - "18445:18445"
    volumes:
      - tls-cert:/certs:ro
      - ./tls.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  gotify-data:
  apprise-config:
  ntfy-cache:
  tls-cert:
